name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
uses: actions/checkout@v4
uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 25
uses: gradle/actions/setup-gradle@v4
  with:
    gradle-version: 9.1.0
name: Unpack
run: unzip -q CameraPlugin.zip -d proj
name: Build
working-directory: proj
run: gradle build --no-daemon
uses: softprops/action-gh-release@v2
with:
  tag_name: latest
  name: CameraSystem (latest)
  files: proj/build/libs/CameraSystem.jar
